# SonarQube Cloud project config.
# projectKey/organization are placeholders - replace with the values shown
# when you create the project at https://sonarcloud.io (Analyze new project).
sonar.projectKey=allxone-vn_check-in
sonar.organization=allxone-vn

sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.test.inclusions=backend/src/test/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/*.min.js,frontend/e2e/**

sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes

sonar.sourceEncoding=UTF-8
