name: CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type "deploy" to deploy to the production VPS after CI passes. Leave blank to just run CI.'
        required: false
        default: ''

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Run tests
      working-directory: ./backend
      run: ./mvnw -B test --file pom.xml
    - name: Upload JaCoCo coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-jacoco-report
        path: backend/target/site/jacoco/
        retention-days: 7
    - name: Build with Maven
      working-directory: ./backend
      run: ./mvnw -B package --file pom.xml -DskipTests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci --ignore-scripts
    - name: Lint
      working-directory: ./frontend
      run: npm run lint
    - name: Unit tests with coverage
      working-directory: ./frontend
      run: npm run test:unit:coverage
    - name: Upload Vitest coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-vitest-coverage
        path: frontend/coverage/
        retention-days: 7
    - name: Build
      working-directory: ./frontend
      run: npm run build

  sonarqube:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    needs: [ backend-build, frontend-build ]
    if: ${{ !!vars.SONAR_ENABLED }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build backend (compiles bytecode for Sonar's Java analyzer)
      working-directory: ./backend
      run: ./mvnw -B verify -DskipTests
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci --ignore-scripts
    - name: SonarQube Cloud Scan
      uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [ backend-build, frontend-build ]
    env:
      # mailhog only exists in the dev override (docker-compose.yml no longer
      # ships it in prod, see 2babf58) — CI needs it to read temp passwords.
      COMPOSE_FILE: docker-compose.yml:docker-compose.dev.yml
      DB_ROOT_PASSWORD: ci_root_password
      DB_USERNAME: root
      DB_PASSWORD: ci_root_password
      MINIO_ACCESS_KEY: ci_minio_user
      MINIO_SECRET_KEY: ci_minio_password
      JWT_SECRET: ci_jwt_secret_minimum_32_characters_long_ok
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      MAIL_HOST: mailhog
      ADMIN_BOOTSTRAP_PASSWORD: ci_admin_password
      # Hundreds of e2e-real logins from one runner IP would otherwise trip
      # LoginRateLimitFilter's real 5/60s default now that it actually works.
      RATE_LIMIT_LOGIN_MAX_ATTEMPTS: "1000"
    steps:
    - uses: actions/checkout@v4

    - name: Start backend stack (mysql, minio, mailhog, backend)
      run: docker compose up -d --build mysql minio mailhog backend

    - name: Wait for backend health
      run: |
        for i in $(seq 1 60); do
          if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
            echo "Backend is up"
            exit 0
          fi
          echo "Waiting for backend... ($i)"
          sleep 5
        done
        echo "Backend did not become healthy in time"
        docker compose logs backend
        exit 1

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci --ignore-scripts

    - name: Install Playwright browsers
      working-directory: ./frontend
      run: node_modules/.bin/playwright install --with-deps chromium

    - name: Run Playwright E2E tests
      working-directory: ./frontend
      run: node_modules/.bin/playwright test

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 7

    - name: Dump backend logs on failure
      if: failure()
      run: docker compose logs backend

    - name: Tear down stack
      if: always()
      run: docker compose down -v

  perf-smoke:
    runs-on: ubuntu-latest
    needs: [ backend-build ]
    env:
      # mailhog only exists in the dev override (docker-compose.yml no longer
      # ships it in prod, see 2babf58) — CI needs it to read temp passwords.
      COMPOSE_FILE: docker-compose.yml:docker-compose.dev.yml
      DB_ROOT_PASSWORD: ci_root_password
      DB_USERNAME: root
      DB_PASSWORD: ci_root_password
      MINIO_ACCESS_KEY: ci_minio_user
      MINIO_SECRET_KEY: ci_minio_password
      JWT_SECRET: ci_jwt_secret_minimum_32_characters_long_ok
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      MAIL_HOST: mailhog
      ADMIN_BOOTSTRAP_PASSWORD: ci_admin_password
      # Hundreds of e2e-real logins from one runner IP would otherwise trip
      # LoginRateLimitFilter's real 5/60s default now that it actually works.
      RATE_LIMIT_LOGIN_MAX_ATTEMPTS: "1000"
    steps:
    - uses: actions/checkout@v4

    - name: Start backend stack (mysql, minio, mailhog, backend)
      run: docker compose up -d --build mysql minio mailhog backend

    - name: Wait for backend health
      run: |
        for i in $(seq 1 60); do
          if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
            echo "Backend is up"
            exit 0
          fi
          echo "Waiting for backend... ($i)"
          sleep 5
        done
        echo "Backend did not become healthy in time"
        docker compose logs backend
        exit 1

    # Native binary install (not a third-party Docker action) so k6 runs on the
    # runner host and reaches the docker-compose backend via the same
    # 127.0.0.1:8080 host port mapping the health-check step above already uses.
    - name: Install k6
      run: |
        curl -sfL --proto '=https' --proto-redir '=https' https://github.com/grafana/k6/releases/download/v2.1.0/k6-v2.1.0-linux-amd64.tar.gz | tar xz --strip-components 1 -C /tmp
        sudo mv /tmp/k6 /usr/local/bin/k6
        k6 version

    - name: Run k6 performance smoke test
      run: k6 run --summary-export=k6-summary.json k6/smoke.js

    - name: Upload k6 summary
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: k6-smoke-summary
        path: k6-summary.json
        retention-days: 7

    - name: Dump backend logs on failure
      if: failure()
      run: docker compose logs backend

    - name: Tear down stack
      if: always()
      run: docker compose down -v

  burn-in:
    runs-on: ubuntu-latest
    needs: [ backend-build, frontend-build ]
    if: github.event_name == 'pull_request'
    env:
      # mailhog only exists in the dev override (docker-compose.yml no longer
      # ships it in prod, see 2babf58) — CI needs it to read temp passwords.
      COMPOSE_FILE: docker-compose.yml:docker-compose.dev.yml
      DB_ROOT_PASSWORD: ci_root_password
      DB_USERNAME: root
      DB_PASSWORD: ci_root_password
      MINIO_ACCESS_KEY: ci_minio_user
      MINIO_SECRET_KEY: ci_minio_password
      JWT_SECRET: ci_jwt_secret_minimum_32_characters_long_ok
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      MAIL_HOST: mailhog
      ADMIN_BOOTSTRAP_PASSWORD: ci_admin_password
      # Hundreds of e2e-real logins from one runner IP would otherwise trip
      # LoginRateLimitFilter's real 5/60s default now that it actually works.
      RATE_LIMIT_LOGIN_MAX_ATTEMPTS: "1000"
      # Security: base SHA passed through env:, not interpolated directly into run: blocks
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BURN_IN_COUNT: 3
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Detect changed Playwright spec files
      id: changed-specs
      run: |
        # Security: BASE_SHA passed through env:, not interpolated directly
        CHANGED=$(git diff --name-only "$BASE_SHA" -- 'frontend/tests/e2e/**/*.spec.ts' 'frontend/tests/e2e-real/**/*.spec.ts' | tr '\n' ' ')
        echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
        if [ -z "$CHANGED" ]; then
          echo "No changed Playwright spec files — burn-in has nothing to do."
        else
          echo "Changed specs: $CHANGED"
        fi

    - name: Start backend stack (mysql, minio, mailhog, backend)
      if: steps.changed-specs.outputs.changed != ''
      run: docker compose up -d --build mysql minio mailhog backend

    - name: Wait for backend health
      if: steps.changed-specs.outputs.changed != ''
      run: |
        for i in $(seq 1 60); do
          if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
            echo "Backend is up"
            exit 0
          fi
          echo "Waiting for backend... ($i)"
          sleep 5
        done
        echo "Backend did not become healthy in time"
        docker compose logs backend
        exit 1

    - name: Use Node.js 22.x
      if: steps.changed-specs.outputs.changed != ''
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install frontend dependencies
      if: steps.changed-specs.outputs.changed != ''
      working-directory: ./frontend
      run: npm ci --ignore-scripts

    - name: Install Playwright browsers
      if: steps.changed-specs.outputs.changed != ''
      working-directory: ./frontend
      run: node_modules/.bin/playwright install --with-deps chromium

    # Runs changed specs BURN_IN_COUNT times with retries disabled — unlike the
    # main e2e-tests job (retries:2 in playwright.config.ts), a single failure
    # here fails the loop immediately, so a flaky spec can't slip through by
    # passing on a retry (see test-design-architecture.md Testability Concern #4).
    - name: Burn-in changed specs (flaky detection)
      if: steps.changed-specs.outputs.changed != ''
      working-directory: ./frontend
      env:
        CHANGED_SPECS: ${{ steps.changed-specs.outputs.changed }}
      run: |
        # Security: CHANGED_SPECS passed through env: as file-path DATA to a fixed
        # `playwright test` command — never treated as a command itself.
        for i in $(seq 1 "$BURN_IN_COUNT"); do
          echo "Burn-in iteration $i/$BURN_IN_COUNT"
          node_modules/.bin/playwright test $CHANGED_SPECS --retries=0 || exit 1
        done

    - name: Dump backend logs on failure
      if: failure()
      run: docker compose logs backend

    - name: Tear down stack
      if: always()
      run: docker compose down -v

  deploy:
    runs-on: ubuntu-latest
    needs: [ e2e-tests ]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_deploy == 'deploy' && github.ref == 'refs/heads/master'
    environment: production
    steps:
    - name: Deploy to production VPS over SSH
      uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
      env:
        DEPLOY_DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
        DEPLOY_DB_USERNAME: ${{ secrets.DB_USERNAME }}
        DEPLOY_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DEPLOY_MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
        DEPLOY_MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        DEPLOY_JWT_SECRET: ${{ secrets.JWT_SECRET }}
        DEPLOY_CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        DEPLOY_MAIL_HOST: ${{ secrets.MAIL_HOST }}
        DEPLOY_ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        # Pass secrets as real env vars on the remote host instead of interpolating
        # ${{ secrets.* }} directly into the script text (avoids shell/script injection
        # if a secret value ever contains shell metacharacters).
        envs: DEPLOY_DB_ROOT_PASSWORD,DEPLOY_DB_USERNAME,DEPLOY_DB_PASSWORD,DEPLOY_MINIO_ACCESS_KEY,DEPLOY_MINIO_SECRET_KEY,DEPLOY_JWT_SECRET,DEPLOY_CORS_ALLOWED_ORIGINS,DEPLOY_MAIL_HOST,DEPLOY_ADMIN_BOOTSTRAP_PASSWORD
        script: |
          set -e
          cd "${{ secrets.VPS_DEPLOY_PATH }}"
          git fetch origin master
          git reset --hard origin/master

          cleanup_env() {
            shred -u .env 2>/dev/null || rm -f .env
          }
          trap cleanup_env EXIT

          umask 077
          cat > .env <<ENVEOF
          DB_ROOT_PASSWORD=$DEPLOY_DB_ROOT_PASSWORD
          DB_USERNAME=$DEPLOY_DB_USERNAME
          DB_PASSWORD=$DEPLOY_DB_PASSWORD
          MINIO_ACCESS_KEY=$DEPLOY_MINIO_ACCESS_KEY
          MINIO_SECRET_KEY=$DEPLOY_MINIO_SECRET_KEY
          JWT_SECRET=$DEPLOY_JWT_SECRET
          CORS_ALLOWED_ORIGINS=$DEPLOY_CORS_ALLOWED_ORIGINS
          MAIL_HOST=$DEPLOY_MAIL_HOST
          ADMIN_BOOTSTRAP_PASSWORD=$DEPLOY_ADMIN_BOOTSTRAP_PASSWORD
          ENVEOF
          chmod 600 .env

          docker compose up -d --build

          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend is healthy after deploy"
              docker image prune -f
              exit 0
            fi
            echo "Waiting for backend to become healthy... ($i)"
            sleep 5
          done

          echo "Deploy failed: backend did not become healthy"
          docker compose logs --tail=200 backend
          exit 1
