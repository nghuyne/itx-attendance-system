services:
  # ---- Backend: Spring Boot (Docker) ----
  - type: web
    name: itx-attendance-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      # ----- Database (external MySQL — Railway/Aiven/Clever Cloud/...) -----
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # ----- Object storage (Cloudflare R2, S3-compatible) -----
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      # ----- Auth -----
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_COOKIE_SECURE
        value: "true"
      # ----- CORS: set to the frontend's Render URL after first deploy -----
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # ----- Admin bootstrap (first boot only) -----
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      # ----- Mail (optional; leave unset if not needed yet) -----
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

  # ---- Frontend: Vite/React static build ----
  - type: web
    name: itx-attendance-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # Proxy API calls to the backend service so frontend's relative
      # baseURL '/api' (frontend/src/services/api.ts) keeps working unchanged.
      - type: rewrite
        source: /api/*
        destination: https://itx-attendance-backend.onrender.com/api/*
      - type: rewrite
        source: /actuator/*
        destination: https://itx-attendance-backend.onrender.com/actuator/*
      # SPA fallback — must stay last.
      - type: rewrite
        source: /*
        destination: /index.html
